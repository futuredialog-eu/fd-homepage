name: test

# Runs on every pull request (Dependabot's included) — merging to main
# deploys straight away (see the other workflow here), so this is the one
# check that runs before that.

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
